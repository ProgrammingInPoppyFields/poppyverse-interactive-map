<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to the Poppyverse</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="50%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="52">🌷</text></svg>'>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

  <style>
    :root {
      --poppy-pink: #FF1447;
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --nav-height: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Only <html> paints the base colour: an opaque <body> background would
       cover the fixed <poppy-aurora> layer sitting behind the content. */
    html {
      background: #06060a;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      padding: calc(var(--nav-height) + 72px) 24px 64px;
      display: grid;
      place-items: center;
    }

    .hero {
      width: min(1080px, 100%);
      text-align: center;
    }

    .title {
      margin: 0;
      color: var(--poppy-pink);
      font-family: "Michroma", sans-serif;
      font-size: clamp(38px, 8vw, 62px);
      line-height: 1.05;
      letter-spacing: 0.055em;
      text-transform: uppercase;
      text-shadow:
        0 0 12px rgba(255, 20, 71, 0.68),
        0 0 36px rgba(255, 20, 71, 0.38),
        0 0 70px rgba(0, 0, 0, 0.92);
    }

    .subtitle {
      max-width: 760px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 1.7vw, 19px);
      line-height: 1.65;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.82);
    }

    .actions {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.48);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.36);
      cursor: pointer;
      transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.42);
      background: var(--poppy-pink);
      box-shadow: 0 0 26px rgba(255, 20, 71, 0.48);
    }

    @media (max-width: 760px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

    }
  </style>
</head>

<body>
  <script src="components/poppy-aurora.js"></script>
  <poppy-aurora></poppy-aurora>
  <script src="components/poppy-nav.js"></script>
<poppy-nav></poppy-nav>

  <main class="page">
    <section class="hero">
      <h1 class="title">WELCOME TO THE POPPYVERSE</h1>

      <p class="subtitle">
        A quantum story archive for narrative inconsistency, emotional damage,
        and suspiciously well-organized chaos.
      </p>

      <div class="actions">
        <a class="button" href="reading_guide.html">Reading Guide</a>
        <a class="button" href="2d_map.html">Enter 2D Map</a>
        <a class="button" href="3d_map.html">Enter 3D Map</a>
      </div>

    </section>
  </main>
</body>
</html>
